name: Suggest a feature
description: Something MedSearch could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like to do
      description: For example, the kind of search it would help with.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
  - type: textarea
    id: how
    attributes:
      label: How it might work
      description: Optional. For a new source, its name and, where there is one, its public API.
